# Lint and test the Python code on every pull request and on merges to main.
# Needs no secrets: the loader tests load into DuckDB, not Snowflake.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved; a SHA can't). Version in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked  # fails if uv.lock is out of date with pyproject.toml

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint (pre-commit hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          # no-commit-to-branch: merges to main run here on main; the guard is for local commits.
          # sqlfluff-lint: compiles through dbt, so it needs Snowflake credentials; moves to the dbt CI job.
          SKIP: no-commit-to-branch,sqlfluff-lint

      - name: Test
        run: uv run pytest
