# Build and test what a pull request changes in Snowflake ("slim CI"). Each PR gets its own schema,
# ANALYTICS_DEV.DBT_PR_<number>, rebuilt from empty on every run and dropped when the PR closes
# (dbt_ci_cleanup.yml). Connects as DBT_CI_SVC (role DEVELOPER: reads RAW and ANALYTICS, writes only
# ANALYTICS_DEV).
#
# Slim CI compares the PR with production's manifest.json (uploaded by dbt_deploy.yml) and builds only
# state:modified+, the nodes that differ plus everything downstream. With --defer, refs to unchanged models read
# production (ANALYTICS) instead of being rebuilt. dbt_project_evaluator is disabled in prod, so it never appears in
# the prod manifest and always counts as modified: it audits the whole project on every PR.
#
# Falls back to a full build when there's no production manifest to compare against (no successful deploy, or its
# artifact expired) or when the PR changes dependencies (a dbt, adapter or package upgrade changes how every model
# builds, which state comparison can't see).
name: dbt CI

on:
  pull_request:
    paths:
      - "transform/**"
      - ".sqlfluff"
      - ".sqlfluffignore"
      - ".github/sqlfluff-ci.cfg"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/dbt_ci.yml"

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read         # download production's manifest from the deploy workflow's artifacts
  pull-requests: read   # list the PR's changed files, to spot dependency upgrades

env:
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
  DBT_SCHEMA: DBT_PR_${{ github.event.pull_request.number }}

jobs:
  dbt:
    name: Lint SQL and dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        working-directory: transform
        run: uv run dbt deps

      - name: Lint SQL (SQLFluff, dbt templater)
        run: uv run sqlfluff lint transform/models --config .github/sqlfluff-ci.cfg

      # Decides slim or full. Writes mode=slim|full to the step output and says why in the log.
      - name: Choose slim or full build
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          full() { echo "::notice::Full build: $1"; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; }

          changed=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          deps=$(grep -x -E 'pyproject\.toml|uv\.lock|transform/packages\.yml|transform/package-lock\.yml' <<< "$changed" || true)
          [ -z "$deps" ] || full "this PR changes dependencies ($(echo $deps))"

          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dbt_deploy.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$run_id" ] || full "no successful production deploy to compare against"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name dbt-prod-artifacts --dir prod-state \
            || full "the artifact from deploy run $run_id couldn't be downloaded (expired?)"

          echo "::notice::Slim build: comparing against production from deploy run $run_id"
          echo "mode=slim" >> "$GITHUB_OUTPUT"

      - name: Start from an empty PR schema
        working-directory: transform
        run: |
          uv run dbt run-operation drop_pr_schema --args "{schema_name: $DBT_SCHEMA}" --target ci

      - name: dbt build (models, tests, dbt_project_evaluator)
        working-directory: transform
        env:
          BUILD_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$BUILD_MODE" = "slim" ]; then
            uv run dbt build --select state:modified+ --defer --state ../prod-state --target ci
          else
            uv run dbt build --target ci
          fi
