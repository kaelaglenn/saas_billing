# Install with `dbt deps`. Exact versions are pinned in package-lock.yml (committed).
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.4.0", "<1.5.0"]

  # Maintained fork; calogica/dbt_expectations is no longer maintained.
  - package: metaplane/dbt_expectations
    version: [">=0.10.10", "<0.11.0"]

  - package: dbt-labs/dbt_project_evaluator
    version: [">=1.4.0", "<1.5.0"]

  # Development helper: drafts staging models and YAML from warehouse metadata. Only runs when called.
  - package: dbt-labs/codegen
    version: [">=0.14.0", "<0.15.0"]
