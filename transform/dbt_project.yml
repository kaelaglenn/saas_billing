name: saas_billing
version: "1.0.0"
profile: saas_billing    # connection settings live in profiles.yml, next to this file

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  # dbt_project_evaluator's documented exceptions mechanism has the package ref this project's
  # dbt_project_evaluator_exceptions seed, which dbt reports once per evaluator model on every full parse
  # (event PackageNodeDependsOnRootProjectNode). Silence only that event; revisit when upgrading dbt or the
  # evaluator (dbt may later default to searching the package first, which would bypass our exceptions seed).
  warn_error_options:
    silence:
      - PackageNodeDependsOnRootProjectNode

vars:
  # The business reports in Eastern Time: months, month-end MRR, and anything bucketed by date use this timezone.
  # Data is stored and computed in UTC; convert only where a reporting date or period is needed.
  reporting_timezone: America/New_York
  # A trial is "matured" (its outcome can be measured) once its trial period plus this buffer has passed as of
  # the data watermark. Starting assumption; revisit after measuring how conversion timing is distributed.
  trial_maturity_buffer_days: 5

# Defaults per folder, so individual models rarely need their own config.
# +schema only takes effect in prod; dev and CI build everything into one schema (see macros/generate_schema_name.sql).
models:
  saas_billing:
    staging:            # one cleaned-up model per raw table: rename, cast, deduplicate
      +materialized: view
      +schema: staging
    intermediate:       # reusable steps between staging and marts
      +materialized: view
      +schema: intermediate
    marts:              # final models people query
      +materialized: table
      +schema: marts
      # Published interface: column names and types are declared in YAML and enforced at build time, so a change
      # that would break consumers fails the build instead of silently changing a table.
      +contract:
        enforced: true
      # ...and declared public, since exposures (models/exposures.yml) read them.
      +access: public

  # Audits the project's structure (naming, DAG shape, test and doc coverage). Dev and CI only, never prod.
  dbt_project_evaluator:
    +enabled: "{{ target.name != 'prod' }}"
    marts:
      tests:
        # Off until scheduled loads exist: the generated data has a fixed end date, so freshness checks would
        # warn on every run. Re-enable when source freshness is added.
        fct_sources_without_freshness:
          +enabled: false

seeds:
  saas_billing:         # small, hand-maintained reference data
    +schema: seeds
    plan_prices:
      +column_types:
        unit_price_cents: number(38, 0)
    # Documented exceptions to dbt_project_evaluator findings; only needed where the evaluator runs.
    dbt_project_evaluator_exceptions:
      +enabled: "{{ target.name != 'prod' }}"
  dbt_project_evaluator:
    +enabled: "{{ target.name != 'prod' }}"
    # replaced by this project's own exceptions seed
    dbt_project_evaluator_exceptions:
      +enabled: false
