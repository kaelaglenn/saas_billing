models:

  - name: dim_reporting_months
    description: >
      The reporting calendar: one row per month in the reporting timezone (America/New_York), from the opening
      balance month (December 2023) through the latest month in the data. month_ended_at is the month-end cutoff:
      the UTC instant of local midnight on the first of the next month.
    columns:
      - name: month_start_date
        description: Primary key. First day of the month (reporting timezone).
        data_type: date
        data_tests:
          - unique
          - not_null
      - name: month_end_date
        description: Last day of the month (reporting timezone).
        data_type: date
      - name: month_label
        description: The month as YYYY-MM, for display.
        data_type: varchar
      - name: year
        description: Calendar year of the month.
        data_type: number(38, 0)
      - name: month_started_at
        description: Local midnight on the first of the month, as a UTC instant (inclusive).
        data_type: timestamp_tz
      - name: month_ended_at
        description: Local midnight on the first of the next month, as a UTC instant; the month-end cutoff (exclusive).
        data_type: timestamp_tz
      - name: is_opening_balance
        description: >
          True for the first month only. The data starts at the Jan 1, 2024 00:00 UTC cutover (Dec 31 evening in
          ET), so this month's ending state is known but activity during it isn't.
        data_type: boolean
      - name: is_month_closed
        description: True when the month-end cutoff is at or before the latest data; false while a month is provisional.
        data_type: boolean
      - name: is_activity_complete
        description: True when the whole month is covered by the data (false for the opening and provisional months).
        data_type: boolean
