models:

  - name: fct_subscription_months
    description: >
      Periodic snapshot: one row per subscription per reporting month-end, for each month-end the subscription is
      live or trialing, plus the first month-end after it ends. MRR is the subscription's MRR at the month-end
      cutoff; previous_mrr_cents is its MRR at the previous month-end (0 if it had no row then).

      movement_type classifies mrr_change_cents: new (first paid month), reactivation (a returning account's new
      subscription), expansion, contraction, churn (MRR went to zero), unchanged, none (no MRR either side, e.g.
      trial months), or opening (the opening balance month, which has no movements). Movements are classified by
      the MRR change alone; has_seat_change, has_plan_change, and has_frequency_change explain it. For example a
      monthly-to-annual switch is a contraction (the annual discount lowers MRR) with has_frequency_change.
      Signed: contraction and churn are negative.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [subscription_id, month_start_date_et]
      - dbt_utils.expression_is_true:
          name: fct_subscription_months_movement_signs
          arguments:
            expression: >
              movement_type = 'opening'
              or (movement_type in ('new', 'reactivation', 'expansion') and mrr_change_cents > 0)
              or (movement_type in ('contraction', 'churn') and mrr_change_cents < 0)
              or (movement_type in ('unchanged', 'none') and mrr_change_cents = 0)
      - dbt_utils.expression_is_true:
          name: fct_subscription_months_churn_type_only_on_churn
          arguments:
            expression: "(movement_type = 'churn') = (churn_type is not null)"
    columns:
      - name: subscription_month_id
        description: Primary key; surrogate key of subscription_id and month_start_date_et.
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: The subscription.
        data_type: varchar
        data_tests:
          - not_null
      - name: account_id
        description: The customer.
        data_type: varchar
      - name: month_start_date_et
        description: The reporting month.
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reporting_months')
                field: month_start_date_et
      - name: month_end_date_et
        description: Last day of the reporting month.
        data_type: date
      - name: subscription_status
        description: Status at the month-end cutoff.
        data_type: varchar
      - name: plan
        description: Plan at the month-end cutoff.
        data_type: varchar
      - name: billing_frequency
        description: Billing frequency at the month-end cutoff.
        data_type: varchar
      - name: seats
        description: Seats at the month-end cutoff.
        data_type: number(38, 0)
      - name: mrr_cents
        description: MRR at the month-end cutoff; zero unless active or past_due.
        data_type: number(38, 0)
      - name: previous_mrr_cents
        description: MRR at the previous month-end; 0 if the subscription had no row then.
        data_type: number(38, 0)
      - name: mrr_change_cents
        description: mrr_cents - previous_mrr_cents. Negative for contraction and churn.
        data_type: number(38, 0)
      - name: movement_type
        description: What the MRR change represents.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["opening", "new", "reactivation", "expansion", "contraction", "churn", "unchanged", "none"]
      - name: churn_type
        description: For churn rows, voluntary (cancelled) or involuntary (lapsed); null otherwise.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["voluntary", "involuntary"]
      - name: has_seat_change
        description: Seats differ from the previous month-end.
        data_type: boolean
      - name: has_plan_change
        description: Plan differs from the previous month-end.
        data_type: boolean
      - name: has_frequency_change
        description: Billing frequency differs from the previous month-end.
        data_type: boolean
      - name: is_reactivation
        description: The subscription is a returning account's new subscription.
        data_type: boolean
      - name: is_month_closed
        description: False for the provisional latest month.
        data_type: boolean
      - name: is_activity_complete
        description: False for the opening and provisional months.
        data_type: boolean

  - name: fct_mrr_bridge
    description: >
      MRR bridge (roll-forward, or MRR walk): one row per reporting month explaining how MRR moved from the
      previous month-end to this one: ending = starting + new + expansion + reactivation + contraction + churned.
      Movements are signed (contraction and churned negative) and sum to net_new_mrr_cents. Subscription counts
      follow the same flow for paying subscriptions, compared month-end to month-end: a subscription that
      converts and lapses between two month-ends is in neither new nor churned (13 over the data; ADR 0008). Count
      churn events from dim_subscriptions (ended_at, end_reason) when every lapse matters. The opening balance month has an ending balance only; its
      starting balance and movements are null because activity before the data starts is unknown. The latest
      month may be provisional (is_month_closed = false).
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_mrr_bridge_mrr_balances
          arguments:
            expression: "starting_mrr_cents + net_new_mrr_cents = ending_mrr_cents"
          config:
            where: "not is_opening_balance"
      - dbt_utils.expression_is_true:
          name: fct_mrr_bridge_subscription_counts_balance
          arguments:
            expression: >
              starting_subscriptions + new_subscriptions + reactivated_subscriptions - churned_subscriptions
              = ending_subscriptions
          config:
            where: "not is_opening_balance"
      - dbt_utils.expression_is_true:
          name: fct_mrr_bridge_churn_split_adds_up
          arguments:
            expression: >
              voluntarily_churned_subscriptions + involuntarily_churned_subscriptions = churned_subscriptions
          config:
            where: "not is_opening_balance"
    columns:
      - name: month_start_date_et
        description: Primary key. The reporting month.
        data_type: date
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reporting_months')
                field: month_start_date_et
      - name: month_end_date_et
        description: Last day of the reporting month.
        data_type: date
      - name: month_label
        description: The month as YYYY-MM.
        data_type: varchar
      - name: starting_mrr_cents
        description: MRR at the previous month-end. Null for the opening month.
        data_type: number(38, 0)
      - name: new_mrr_cents
        description: MRR from subscriptions paying for the first time this month.
        data_type: number(38, 0)
      - name: expansion_mrr_cents
        description: Increases on subscriptions already paying.
        data_type: number(38, 0)
      - name: reactivation_mrr_cents
        description: MRR from returning accounts' new subscriptions.
        data_type: number(38, 0)
      - name: contraction_mrr_cents
        description: Decreases on subscriptions still paying (negative).
        data_type: number(38, 0)
      - name: churned_mrr_cents
        description: MRR lost from subscriptions that stopped paying (negative).
        data_type: number(38, 0)
      - name: net_new_mrr_cents
        description: Sum of the movements; ending minus starting.
        data_type: number(38, 0)
      - name: ending_mrr_cents
        description: MRR at this month-end.
        data_type: number(38, 0)
      - name: starting_subscriptions
        description: Paying subscriptions at the previous month-end. Null for the opening month.
        data_type: number(38, 0)
      - name: new_subscriptions
        description: >
          Subscriptions with MRR at this month-end and none at the previous one, other than reactivations (counted
          in reactivated_subscriptions).
        data_type: number(38, 0)
      - name: reactivated_subscriptions
        description: Returning accounts' new subscriptions paying this month.
        data_type: number(38, 0)
      - name: churned_subscriptions
        description: Subscriptions with MRR at the previous month-end and none at this one.
        data_type: number(38, 0)
      - name: voluntarily_churned_subscriptions
        description: Churned by cancellation.
        data_type: number(38, 0)
      - name: involuntarily_churned_subscriptions
        description: Churned by lapsing (payment failure or unpaid invoice).
        data_type: number(38, 0)
      - name: ending_subscriptions
        description: Paying subscriptions (active or past_due) at this month-end.
        data_type: number(38, 0)
      - name: is_opening_balance
        description: True for the opening month, which has no starting balance or movements.
        data_type: boolean
      - name: is_month_closed
        description: False for the provisional latest month.
        data_type: boolean
      - name: is_activity_complete
        description: False for the opening and provisional months.
        data_type: boolean

  - name: dim_subscription_history
    description: >
      SCD Type 2 history of each subscription's effective state (status, plan, seats, billing frequency, MRR) over
      [valid_from, valid_to): one row per period during which none of them changed. Effective state only;
      requested-but-not-yet-effective changes are in fct_subscription_change_requests.
    columns:
      - name: subscription_history_id
        description: Primary key; surrogate key of subscription_id and valid_from.
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: The subscription.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscriptions')
                field: subscription_id
      - name: account_id
        description: The customer.
        data_type: varchar
      - name: subscription_status
        description: Effective status during the period.
        data_type: varchar
      - name: plan
        description: Effective plan during the period.
        data_type: varchar
      - name: billing_frequency
        description: Effective billing frequency during the period.
        data_type: varchar
      - name: seats
        description: Effective seats during the period.
        data_type: number(38, 0)
      - name: mrr_cents
        description: MRR during the period; zero unless active or past_due.
        data_type: number(38, 0)
      - name: valid_from
        description: Start of the period (UTC), inclusive.
        data_type: timestamp_tz
      - name: valid_to
        description: End of the period (UTC), exclusive; null for the current period.
        data_type: timestamp_tz
      - name: is_current
        description: True for the subscription's latest period.
        data_type: boolean

  - name: fct_subscription_change_requests
    description: >
      Transaction fact: one row per customer-initiated change (seat increases and decreases, plan upgrades and
      downgrades, billing frequency switches) and cancellation, including cancellations requested before the
      Jan 1, 2024 cutover. outcome: applied, pending (effective after the latest data), or never_took_effect (the
      subscription lapsed or was cancelled first). For point-in-time features (e.g. churn models), filter on
      ingested_at, when the request became known to the warehouse.
    columns:
      - name: change_request_id
        description: Primary key; the event_id of the event recording the request.
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: subscription_id
        description: The subscription.
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscriptions')
                field: subscription_id
      - name: account_id
        description: The customer.
        data_type: varchar
      - name: request_type
        description: seat_increase, seat_decrease, plan_upgrade, plan_downgrade, frequency_switch, or cancellation.
        data_type: varchar
      - name: from_plan
        description: For plan changes, the plan before.
        data_type: varchar
      - name: to_plan
        description: For plan changes, the plan after.
        data_type: varchar
      - name: from_billing_frequency
        description: For frequency switches, the frequency before.
        data_type: varchar
      - name: to_billing_frequency
        description: For frequency switches, the frequency after.
        data_type: varchar
      - name: cancel_reason
        description: For cancellations, the customer's reason.
        data_type: varchar
      - name: outcome
        description: applied, pending, or never_took_effect.
        data_type: varchar
      - name: seat_delta
        description: For seat changes, the signed change.
        data_type: number(38, 0)
      - name: is_scheduled
        description: Takes effect after it was requested (decreases, downgrades, switches, cancellations).
        data_type: boolean
      - name: requested_at
        description: When the customer made the request (UTC).
        data_type: timestamp_tz
      - name: effective_at
        description: When the change took or will take effect (UTC).
        data_type: timestamp_tz
      - name: ingested_at
        description: When the request landed in the warehouse (UTC).
        data_type: timestamp_tz
      - name: requested_date_et
        description: Date requested, in the reporting timezone (America/New_York).
        data_type: date
      - name: effective_date_et
        description: Date effective, in the reporting timezone (America/New_York).
        data_type: date

  - name: fct_trials
    description: >
      Accumulating snapshot: one row per trial (a subscription that started with a trial; imported subscriptions
      and reactivations had none), with its milestones and outcome: converted, expired, or in_progress.

      is_matured: the trial period plus var trial_maturity_buffer_days (5) has passed as of the data watermark,
      so the outcome can be measured. Use matured trials only for conversion rates, so recent cohorts with trials
      still running don't look artificially low. The 5-day buffer is a starting assumption to revisit after
      measuring how conversion timing is distributed.
    data_tests:
      - dbt_utils.expression_is_true:
          name: fct_trials_converted_iff_converted_at
          arguments:
            expression: "(trial_outcome = 'converted') = (converted_at is not null)"
      - dbt_utils.expression_is_true:
          name: fct_trials_conversion_within_trial
          arguments:
            expression: "converted_at >= trial_started_at and converted_at < trial_ends_at"
          config:
            where: "trial_outcome = 'converted'"
      - dbt_utils.expression_is_true:
          name: fct_trials_expire_at_trial_end
          arguments:
            expression: "expired_at = trial_ends_at"
          config:
            where: "trial_outcome = 'expired'"
      - dbt_utils.expression_is_true:
          name: fct_trials_matured_trials_have_outcomes
          arguments:
            expression: "trial_outcome != 'in_progress'"
          config:
            where: "is_matured"
    columns:
      - name: subscription_id
        description: Primary key; the subscription that started with this trial.
        data_type: varchar
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_subscriptions')
                field: subscription_id
      - name: account_id
        description: The customer.
        data_type: varchar
      - name: plan
        description: Plan chosen at trial start.
        data_type: varchar
      - name: billing_frequency
        description: Billing frequency chosen at trial start.
        data_type: varchar
      - name: trial_outcome
        description: converted, expired, or in_progress.
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["converted", "expired", "in_progress"]
      - name: seats
        description: Seats chosen at trial start.
        data_type: number(38, 0)
      - name: days_to_convert
        description: Whole days from trial start to conversion (0 = within the first 24 hours); null unless converted.
        data_type: number(38, 0)
      - name: is_matured
        description: The trial period plus the maturity buffer has passed as of the latest data.
        data_type: boolean
      - name: trial_started_at
        description: Trial start (UTC).
        data_type: timestamp_tz
      - name: trial_ends_at
        description: When the trial ends if not converted (UTC).
        data_type: timestamp_tz
      - name: converted_at
        description: Paid start (UTC); null unless converted.
        data_type: timestamp_tz
      - name: expired_at
        description: When the trial expired (UTC); null unless expired.
        data_type: timestamp_tz
      - name: trial_start_date_et
        description: Trial start date in the reporting timezone (America/New_York).
        data_type: date
      - name: trial_start_month_et
        description: First day of the trial start month in the reporting timezone; the conversion cohort.
        data_type: date
