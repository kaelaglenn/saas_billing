seeds:

  - name: plan_prices
    description: >
      List price per seat per billing period, by plan and billing frequency, in USD cents. Annual prices include
      the 10% annual discount. Maintained by hand; changing a price here changes MRR everywhere it's used.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [plan, billing_frequency]
    columns:
      - name: plan
        description: The subscription plan this price applies to, either pro or premium.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pro", "premium"]
      - name: billing_frequency
        description: How often this price is billed, either monthly or annual (annual prices include the 10% discount).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["monthly", "annual"]
      - name: unit_price_cents
        description: Price per seat for one billing period (one month or one year).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
