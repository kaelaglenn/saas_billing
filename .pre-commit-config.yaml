# Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch      # work happens on branches; main changes only through PRs
        args: [--branch, main]
      - id: detect-private-key       # Snowflake key-pair auth means private keys exist on this machine
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check

  # SQLFluff with the dbt templater compiles models through dbt, so it runs from the project's own environment
  # (exact versions from uv.lock) and needs the Snowflake variables that direnv loads from .env.
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt SQL)
        entry: uv run --no-sync sqlfluff lint
        language: system
        files: ^transform/(models|tests|analyses|snapshots)/.*\.sql$
        require_serial: true
